name: Flutter Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: |
        cd crypto_calc
        flutter pub get

    - name: Build APK (Test için)
      run: |
        cd crypto_calc
        flutter build apk --split-per-abi

    - name: Build App Bundle (Google Play için)
      run: |
        cd crypto_calc
        flutter build appbundle

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: crypto_calc/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: crypto_calc/build/app/outputs/bundle/release/app-release.aab
